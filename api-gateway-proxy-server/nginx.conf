events {}
http {
  # Distribute requests between the two web replicas using Round Robin.
  upstream web_backend {
    server web-frontend-server1:80 max_fails=1 fail_timeout=10s;
    server web-frontend-server2:80 max_fails=1 fail_timeout=10s;
  }
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Port $server_port;

  server {
    listen 80;
    location / {
      proxy_pass http://web_backend;
      proxy_connect_timeout 2s;
      proxy_next_upstream error timeout http_502 http_503;
    }

    location /api/ {
      proxy_pass http://application-backend-server:8081/;
    }

    # Preserve /auth/ because Keycloak uses KC_HTTP_RELATIVE_PATH=/auth.
    location /auth/ {
      proxy_pass http://authentication-identity-server:8080/auth/;
      proxy_buffer_size 16k;
      proxy_buffers 8 16k;
    }

    # Forward the student table route to Flask.
    location /student/ {
      proxy_pass http://application-backend-server:8081/student;
    }

    location = /gateway-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }
  }
}
